# ECDAT frontend nginx config.
#
# The web container serves the Vite production build (static files) and
# reverse-proxies `/api` and `/health` to the `api` service. This is the same
# routing the dev server's Vite proxy uses (see vite.config.ts), so the built
# bundle keeps its default **same-origin** `VITE_API_BASE_URL` (`''`) — the
# browser talks only to nginx, which forwards to the backend. No runtime env
# substitution is needed, which is the simplest thing to get right in a
# container and keeps the API host/port out of the client bundle entirely.
#
# The API service is reachable by its compose service name `api` on port 8000
# (the same DATABASE_URL/REDIS_URL naming convention the other services use).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived immutable asset caching for Vite's content-hashed files.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy the API + health endpoints to the FastAPI backend.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: unknown paths serve index.html so client-side routes
    # (e.g. /scans/:id) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
