[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecdat-core"
version = "0.1.0"
description = "Cryptography Bill of Materials scanner for post-quantum readiness assessment"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "jsonschema",  # official CycloneDX 1.6 CBOM schema validation (Phase 48)
]

[tool.setuptools.packages.find]
include = ["ecdat_core*"]

[tool.setuptools.package-data]
ecdat_core = ["signatures.json"]

[tool.pytest.ini_options]
addopts = "-v -m 'not network'"
markers = [
    "network: tests that require network access (explicitly opt-in)",
]
