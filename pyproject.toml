[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecdat"
version = "0.2.0.dev0"
description = "Cryptographic discovery and post-quantum readiness scanner — CLI with a gradient ASCII banner and an animated 3D globe (CBOM, CycloneDX 1.6)"
readme = {file = "PYPI_README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ECDAT Team" },
]
keywords = [
    "cbom",
    "cli",
    "cryptography",
    "cyclonedx",
    "post-quantum",
    "pqc",
    "quantum",
    "sbom",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "jsonschema",  # official CycloneDX 1.6 CBOM schema validation (Phase 48)
    "build",       # PEP 517 build frontend — `python -m build` (Phase 53)
    "twine",       # TestPyPI/PyPI upload tooling (Phase 53)
]

[project.urls]
Homepage = "https://github.com/profm0r14rty/ecdat"
Repository = "https://github.com/profm0r14rty/ecdat"
Issues = "https://github.com/profm0r14rty/ecdat/issues"
Changelog = "https://github.com/profm0r14rty/ecdat/blob/main/CHANGELOG.md"

[project.scripts]
ecdat = "ecdat.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["ecdat*"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*", "backend*", "frontend*"]

[tool.setuptools.package-data]
ecdat_core = ["signatures.json"]
ecdat = ["py.typed", "demo_project/**/*"]

[tool.pytest.ini_options]
addopts = "-v -m 'not network'"
markers = [
    "network: tests that require network access (explicitly opt-in)",
    "packaging: builds the wheel and inspects it (slow)",
]