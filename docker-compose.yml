# docker-compose.yml - ECDAT Project
# Local development stack: Postgres (persistence), Redis (scan job status),
# and the FastAPI backend. The Batch 3 `web` (frontend) service is reserved
# below as a commented placeholder.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecdat}
      POSTGRES_USER: ${POSTGRES_USER:-ecdat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecdat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    # Build context is the REPO ROOT (not ./backend): the FastAPI app imports
    # the ecdat_core scanner package, which lives at the monorepo root.
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecdat}:${POSTGRES_PASSWORD:-ecdat}@postgres:5432/${POSTGRES_DB:-ecdat}
      REDIS_URL: redis://redis:6379/0
      # Phase 46 optional API-key gate — off by default; flip on via .env.
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-false}
      API_KEYS: ${API_KEYS:-}
    ports:
      - "8000:8000"
    working_dir: /app/backend
    volumes:
      # Dev hot-reload: host backend/ is bind-mounted over the image copy and
      # uvicorn runs with --reload. The image sets PYTHONPATH=/app so
      # `backend.app.*` imports resolve through the mount, not site-packages.
      - ./backend:/app/backend
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  web:
    # Batch 3 React + Vite + TS frontend dashboard.
    # Multi-stage image (node build -> nginx). nginx serves the static bundle
    # and reverse-proxies /api + /health to the `api` service, so the bundle
    # keeps its same-origin VITE_API_BASE_URL (no runtime substitution needed).
    # Host port 5173 is the Vite dev default the AGENTS.md/CORS docs reference.
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
